name: Adapter contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - run: npm install --global pnpm@10.20.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test:contract
      - run: pnpm run test:lifecycle
      - run: pnpm run test:integration
      - run: pnpm run check:design
      - run: pnpm run generate:sbom
      - run: pnpm run check:release
      - run: pnpm run check:secrets
      - run: pnpm pack --pack-destination .runtime/distribution
      - run: pnpm run check:package
      - run: node tools/check-secrets.mjs --archive .runtime/distribution/swarm-rdsh-0.2.1-dev.0.tgz
